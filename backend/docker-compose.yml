version: "3"

services:

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  server:
    build: .
    ports:
      - "5001:5001"
    environment:
      - REDIS_HOST=redis
      - TEMP_DIR=/tmp/jobs
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/jobs:/tmp/jobs
    depends_on:
      - redis

  worker:
    build: .
    command: node worker.js
    environment:
      - REDIS_HOST=redis
      - TEMP_DIR=/tmp/jobs
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/jobs:/tmp/jobs
    depends_on:
      - redis
